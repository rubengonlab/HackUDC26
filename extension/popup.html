<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    /* KELEA CORPORATIVE DARK THEME */
    :root {
      --primary: #1A1F4D;       
      --primary-dark: #0D1021;  
      --primary-light: #2A3166; 
      --accent: #FF5856;        
      --accent-hover: #E54B49;  
      --bg-color: #0D1021;      
      --surface: #1A1F4D;       
      --border: #2A3166;        
      --text-main: #FFFFFF;     
      --text-muted: #9BA4D5;    
      --success: #10B981;       
    }

    body {
      width: 360px;
      height: 540px; 
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      position: relative;
      border-top: 4px solid var(--accent); 
      overflow: hidden;
    }

    /* CLASE BASE PARA PANTALLAS (OCULTAS POR DEFECTO) */
    .screen { 
      display: none; /* Importante: manejado por JS */
      height: 100%; 
      flex-direction: column; 
    }

    /* --- [PANTALLA DE LOGIN SaaS] --- */
    #pantallaLogin {
      padding: 0;
      background: radial-gradient(circle at top right, var(--primary-light), var(--primary-dark));
      align-items: center;
      justify-content: center;
      /* Eliminado display:flex de aquí para evitar solapamiento */
    }

    .login-card {
      background-color: var(--surface);
      width: 80%;
      padding: 35px 24px 25px 24px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
      animation: slideUp 0.5s ease-out;
    }

    .login-logo-container {
      width: 70px;
      height: 70px;
      background-color: var(--bg-color);
      margin: -70px auto 15px auto; 
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(255, 88, 86, 0.2);
      border: 4px solid var(--surface);
    }

    .login-logo { width: 45px; height: 45px; object-fit: contain; }
    .login-header-text h3 { margin: 10px 0 5px 0; font-size: 20px; font-weight: 700; color: #fff; }
    .login-header-text p { margin: 0 0 25px 0; color: var(--text-muted); font-size: 13px; }

    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label {
      display: block; font-size: 11px; text-transform: uppercase;
      font-weight: 700; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.5px;
    }

    .login-input {
      width: 100%; padding: 12px; background-color: var(--primary-dark);
      border: 1px solid var(--border); border-radius: 8px; color: #fff;
      box-sizing: border-box; outline: none; transition: border-color 0.2s;
    }
    .login-input:focus { border-color: var(--accent); }

    .btn-primary-login {
      width: 100%; padding: 14px; background-color: var(--accent);
      color: white; border: none; border-radius: 12px; font-weight: 700;
      cursor: pointer; margin-top: 10px; transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 88, 86, 0.3);
    }
    .btn-primary-login:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

    /* --- [PANTALLA PRINCIPAL] --- */
    .chat-header {
      background-color: var(--surface);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .chat-header h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .header-logo { width: 20px; height: 20px; background-color: var(--accent); border-radius: 4px; }
    .logout { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500;}
    .logout:hover { color: var(--accent); }

    .toast-container {
      position: absolute; top: 70px; left: 0; right: 0;
      padding: 0 16px; display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: none;
    }

    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, var(--primary-dark) 0%, var(--surface) 100%);
    }

    .empty-state-wrapper { margin: auto; opacity: 0.4; }
    .empty-state-icon { font-size: 40px; margin-bottom: 10px; }

    #estado { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; }

    /* FOOTER Y ENTRADA DE TEXTO */
    .app-footer {
      padding: 16px;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      background-color: var(--primary-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 4px 0 12px;
    }

    textarea {
      flex: 1; border: none; outline: none; resize: none;
      font-size: 14px; color: var(--text-main); font-family: inherit;
      padding: 14px 0; min-height: 120px; max-height: 250px;
      background: transparent; line-height: 1.5;
    }

    /* Scrollbar personalizada Kelea */
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-thumb { background-color: var(--primary-light); border-radius: 10px; }
    textarea::-webkit-scrollbar-thumb:hover { background-color: var(--accent); }

    /* INTERFAZ GRABACIÓN */
    #recordingUI {
      display: none; flex: 1; flex-direction: column; align-items: center;
      justify-content: center; min-height: 120px; gap: 8px;
    }
    #tiempoGrabacion { font-size: 36px; font-weight: 700; color: #fff; }
    .recording-label { color: var(--accent); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
    
    .cancel-link { 
      background: none; border: none; color: var(--text-muted); 
      text-decoration: underline; cursor: pointer; font-size: 13px;
    }
    .cancel-link:hover { color: var(--accent); }

    /* BOTONES ACCIÓN */
    .action-btn {
      width: 48px; height: 48px; border-radius: 12px; border: none;
      background-color: var(--accent); color: white; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 88, 86, 0.3);
      transition: all 0.2s;
    }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255, 88, 86, 0.5); }
    .action-btn.is-recording { animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 88, 86, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 88, 86, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 88, 86, 0); }
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .icon-svg { stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  </style>
</head>
<body>

  <div id="pantallaLogin" class="screen">
    <div class="login-card">
      <div class="login-logo-container">
        <img src="icon.png" class="login-logo">
      </div>
      <div class="login-header-text">
        <h3>Kelea JunkDrawer</h3>
        <p>Tu segundo cerebro corporativo</p>
      </div>
      <div class="input-group">
        <label>Usuario</label>
        <input type="text" id="fakeUser" class="login-input" placeholder="usuario_id">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="fakePass" class="login-input" placeholder="••••••••">
      </div>
      <button id="btnEntrar" class="btn-primary-login">ACCEDER AL CAJÓN</button>
    </div>
  </div>

  <div id="pantallaApp" class="screen">
    <div class="chat-header">
      <h3><div class="header-logo"></div> JunkDrawer</h3>
      <button id="btnSalir" class="logout">Cerrar Sesión</button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="app-body">
      <div class="empty-state-wrapper">
        <div class="empty-state-icon">📥</div>
        <div class="empty-state-text">
          <strong>Cajón Sincronizado</strong><br>Listo para capturar tus ideas.
        </div>
      </div>
      <div id="estado"></div>
    </div>

    <div class="app-footer" id="bottomBar">
      <div class="input-wrapper" id="inputWrapper">
        <textarea id="textoNota" placeholder="¿Qué quieres recordar hoy?"></textarea>
      </div>

      <div id="recordingUI">
        <div class="recording-label">🔴 Grabando audio</div>
        <div id="tiempoGrabacion">00:00</div>
        <button id="btnCancelar" class="cancel-link">Descartar nota</button>
      </div>

      <button id="btnGrabar" class="action-btn" title="Grabar audio">
        <svg width="22" height="22" class="icon-svg" viewBox="0 0 24 24">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>

      <button id="btnGuardar" class="action-btn" style="display:none;" title="Sincronizar">
        <svg width="22" height="22" class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
