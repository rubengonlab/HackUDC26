<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kelea - Activar Micrófono</title>
  <style>
    body {
      background-color: #F8F9FB; color: #1A1F4D; font-family: 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; margin: 0; text-align: center;
    }
    h2 { color: #1A1F4D; font-size: 28px; margin-bottom: 10px; font-weight: 700; }
    p { color: #6B7280; font-size: 16px; max-width: 400px; margin-bottom: 30px; line-height: 1.5; }
    button {
      background-color: #1A1F4D; color: white; padding: 14px 32px; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; text-transform: uppercase;
      transition: all 0.2s ease;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    #mensaje { font-weight: 600; margin-top: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <h2>ACTIVACIÓN DE VOZ</h2>
  <p>Para enviar notas de voz directamente, necesitamos que autorices el uso del micrófono. Solo se te pedirá esta vez.</p>
  
  <button id="btnPermitir">CONCEDER PERMISO</button>
  <div id="mensaje"></div>

  <script src="permisos.js"></script>
</body>
</html>
