spring.application.name=junkdrawer
server.servlet.context-path=/junkdrawer
springdoc.swagger-ui.path=/docs
app.upload.base-path=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.whisper.enabled=true
app.whisper.api-url=http://whisper:8000/v1/audio/transcriptions
app.whisper.api-token=sk-dummy-key
app.whisper.model=medium
app.whisper.timeout-seconds=180
app.azure.vision.endpoint=${AZURE_VISION_ENDPOINT}
app.azure.vision.api-key=${AZURE_VISION_KEY}
app.azure.vision.language=es
app.azure.vision.ocr-timeout-seconds=30
